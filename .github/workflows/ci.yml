name: CI
# Lightweight, no-build CI for the static site. Four honest checks:
#   links     - every internal link in the HTML resolves to a real file
#   data      - data.js (+ graph/*-data.js) parse and expose their sections
#   spelling  - codespell over content, with the lab's coined words allow-listed
#   contracts - tests/*.test.mjs site-contract regression bench (one check, whole suite)
# All four checks are REQUIRED on the main ruleset (strict / branches-up-to-date).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/check-links.mjs

  data:
    name: data.js integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/validate-data.mjs

  spelling:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # All spell config (skip / ignore-words / ignore-regex) lives in
      # .codespellrc at the repo root, which codespell reads automatically.
      - uses: codespell-project/actions-codespell@v2

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/run.mjs
