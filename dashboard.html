<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Status — Claudemonzter Lab</title>
<link rel="stylesheet" href="design-system/colors_and_type.css" />
<style>
/* ── Dashboard-local tokens (not in design system) ──────── */
:root {
  --L1: #7b61ff;
  --L2: #5b8def;
  --L3: #4ade80;
  --L4: #f5c56a;
  --L5: #ff6b6b;
  --open: var(--info);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--fg); margin: 0; min-height: 100vh; }
body {
  font-family: var(--font-mono);
  font-size: 13px; padding: 0 0 3rem;
  position: relative; z-index: 1;
}
body::before {
  content: ""; position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 900px 700px at 20% 10%, color-mix(in oklch, var(--accent-deep) 14%, transparent), transparent 60%),
    radial-gradient(ellipse 700px 600px at 80% 80%, color-mix(in oklch, var(--accent) 10%, transparent), transparent 60%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: ""; position: fixed; inset: 0;
  background-image:
    linear-gradient(var(--grid-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size); pointer-events: none; opacity: 0.35; z-index: 0;
}

/* ── TopNav + Footer rendered by React (see mount points below) ── */

/* ── Page content wrapper ─────────────────────────────────── */
.page-content { padding: 1.5rem 2rem 0; }

/* ── Header ───────────────────────────────────────────────── */
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; position: relative; z-index: 1; }
.header-tag { font-family: var(--font-mono); font-size: var(--fs-micro); letter-spacing: var(--ls-widest); text-transform: uppercase; color: var(--accent); margin-bottom: 0.3rem; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-3xl); letter-spacing: var(--ls-tight); color: var(--fg); line-height: var(--lh-tight); font-variation-settings: "opsz" 96; }
h1 span { color: var(--accent); font-style: italic; font-variation-settings: "opsz" 96, "SOFT" 100; }
.header-meta { text-align: right; font-size: var(--fs-xs); color: var(--fg-subtle); letter-spacing: var(--ls-wide); }
.refresh-btn { background: transparent; border: 1px solid var(--line-loud); color: var(--fg-subtle); font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-wide); padding: 0.3rem 0.75rem; cursor: pointer; transition: border-color var(--dur), color var(--dur); display: block; margin-left: auto; margin-top: 0.4rem; }
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Summary ──────────────────────────────────────────────── */
.summary { display: flex; gap: 0.75rem; margin-bottom: 2rem; flex-wrap: wrap; position: relative; z-index: 1; }
.summary-chip { background: var(--bg-elev-2); border: 1px solid var(--line-loud); padding: 0.4rem 0.85rem; font-size: var(--fs-xs); letter-spacing: var(--ls-wide); text-transform: uppercase; display: flex; align-items: center; gap: 0.5rem; }
.chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── Grid ─────────────────────────────────────────────────── */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1px; position: relative; z-index: 1;
}

/* Card styles injected by components/agent-card.js */

/* ── State messages ───────────────────────────────────────── */
.state-msg { padding: 4rem 2rem; text-align: center; color: var(--fg-subtle); position: relative; z-index: 1; }
.state-msg .big { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-2xl); color: var(--line-loud); margin-bottom: 0.5rem; font-variation-settings: "opsz" 96; }

/* ── Footer ───────────────────────────────────────────────── */
.footer { margin-top: 2rem; padding: 0 2rem; display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--fg-subtle); letter-spacing: var(--ls-wide); position: relative; z-index: 1; }
.site-footer {
  border-top: 1px solid var(--line);
  padding: 30px 40px 40px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--fg-faint); position: relative; z-index: 1;
}
.site-footer a { color: var(--fg-muted); text-decoration: none; }
.site-footer a:hover { color: var(--accent); }

/* ── Graph Sub-nav ────────────────────────────────────────── */
.graph-subnav {
  display: flex; align-items: center; gap: 24px;
  padding: 12px 40px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase;
  position: relative; z-index: 1;
}
.graph-subnav-label { color: var(--fg-faint); }
.graph-subnav a { color: var(--fg-muted); text-decoration: none; padding-bottom: 2px; border-bottom: 1px solid transparent; }
.graph-subnav a:hover { color: var(--accent); }
.graph-subnav a.active { color: var(--accent); border-bottom-color: var(--accent); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- ── Site chrome (React) ─────────────────────────────────── -->
<div id="topnav-mount"></div>
<div id="graph-subnav-mount"></div>

<div class="page-content">

<div class="header">
  <div>
    <div class="header-tag">// projects · domains</div>
    <h1>Agent <span>Status</span></h1>
  </div>
  <div class="header-meta">
    <div id="lastRefresh">—</div>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div class="summary" id="summaryBar"></div>

<div id="dashOutput">
  <div class="state-msg"><div class="big">Loading...</div><div>Fetching agent data</div></div>
</div>

</div><!-- .page-content -->

<div id="footer-mount"></div>

<script src="components/agent-card.js"></script>
<script>
// ── Configuration ─────────────────────────────────────────
window.SHEET_ID   = "16OAh0lBMAZJLhJqsu1574PBsD7tkP_sqHIZa58t_-VI";
window.STALE_DAYS = 7; // days before dashboard overrides status to idle

var DOMAIN_TABS = [
  { tab: "Meta1Checkin",    domain: "Meta1",    order: 1, isHuman: false, url: "agents/meta1/meta1.html" },
  { tab: "BondCheckin",     domain: "Bond",     order: 2, isHuman: false, url: "agents/bond/bond.html" },
  { tab: "HouseCheckin",    domain: "House",    order: 3, isHuman: false, url: "agents/house/house.html" },
  { tab: "FreedomCheckin",  domain: "Freedom",  order: 4, isHuman: false, url: "agents/freedom/freedom.html" },
  { tab: "EvolveCheckin",   domain: "Evolve",   order: 5, isHuman: false, url: "agents/evolve/evolve.html" },
  { tab: "AssessorCheckin", domain: "Assessor", order: 6, isHuman: false, url: "agents/assessor/assessor.html" },
  { tab: "PhilCheckin",     domain: "Phil",     order: 7, isHuman: false, url: "agents/phil/phil.html" },
  { tab: "HumanCheckin",    domain: "Jeremy",   order: 8, isHuman: true,  url: null }
];

// ── Summary bar ───────────────────────────────────────────
function renderSummary(cards) {
  var counts = {};
  cards.forEach(function(c) {
    var s = c.displayStatus;
    counts[s] = (counts[s] || 0) + 1;
  });
  var colorMap = {
    active: "var(--ok)",
    open: "var(--open)",
    idle: "var(--fg-subtle)",
    flagged: "var(--warn)",
    blocked: "var(--err)"
  };
  var html = "";
  Object.keys(counts).sort().forEach(function(s) {
    html += '<div class="summary-chip"><div class="chip-dot" style="background:' +
      (colorMap[s] || "var(--fg-subtle)") + '"></div>' + counts[s] + '&nbsp;' + s + '</div>';
  });
  document.getElementById("summaryBar").innerHTML = html;
}

// ── Fetch one tab ─────────────────────────────────────────
function fetchTab(entry) {
  var bust = "&cachebust=" + Date.now();
  return fetch(csvUrl(entry.tab) + bust)
    .then(function(r) { return r.text(); })
    .then(function(text) {
      var rows = parseCSV(text);
      return { entry: entry, rows: rows };
    })
    .catch(function() {
      return { entry: entry, rows: [] };
    });
}

// ── Main load ─────────────────────────────────────────────
function loadData() {
  document.getElementById("lastRefresh").textContent = "Refreshing...";
  document.getElementById("dashOutput").innerHTML =
    '<div class="state-msg"><div class="big">Loading...</div><div>Fetching agent data</div></div>';

  var fetches = DOMAIN_TABS.map(fetchTab);

  Promise.all(fetches).then(function(results) {
    var cards = [];

    results.forEach(function(r) {
      var comp = compositeRows(r.rows);
      comp._entry = r.entry;
      cards.push(comp);
    });

    // Sort by order
    cards.sort(function(a, b) { return a._entry.order - b._entry.order; });

    renderSummary(cards);

    var html = '<div class="grid">';
    cards.forEach(function(c) { html += renderCard(c._entry, c); });
    html += '</div>';
    document.getElementById("dashOutput").innerHTML = html;

    var now = new Date();
    document.getElementById("lastRefresh").textContent =
      "Last refresh: " + now.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", second:"2-digit" });
    var countEl = document.getElementById("agentCount");
    if (countEl) countEl.textContent = cards.length + " domains tracked";

  }).catch(function(err) {
    document.getElementById("dashOutput").innerHTML =
      '<div class="state-msg"><div class="big">Error</div><div>' + esc(String(err)) + '</div></div>';
    document.getElementById("lastRefresh").textContent = "Load failed";
  });
}

loadData();
</script>

<!-- ── React site chrome ───────────────────────────────────── -->
<script src="data.js"></script>
<script type="text/babel" src="components/Wordmark.jsx"></script>
<script type="text/babel" src="components/Primitives.jsx"></script>
<script type="text/babel" src="components/HomeShell.jsx"></script>
<script type="text/babel" src="components/GraphSubnav.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('topnav-mount')).render(<TopNav active="GRAPH" />);
  ReactDOM.createRoot(document.getElementById('graph-subnav-mount')).render(<GraphSubnav active="DASHBOARD" />);
  ReactDOM.createRoot(document.getElementById('footer-mount')).render(<Footer />);
</script>

</body>
</html>
