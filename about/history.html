<!--
  ╔════════════════════════════════════════════════════════════════════════╗
  ║  ABOUT · history.html — "Our History" list page                        ║
  ║                                                                        ║
  ║  Lists the INTERACTIVE month-by-month graphs (window.HISTORY in        ║
  ║  data.js) — the operator + agents story told over time. Kept distinct  ║
  ║  from written essays (those live on writing.html). Mirrors the         ║
  ║  writing.html list layout. Month 2/3 are placeholders (#200, #205).    ║
  ╚════════════════════════════════════════════════════════════════════════╝
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>About · Our History · Claudemonzter</title>

<!-- ── Social / SEO (meta1 injector) ── -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Claudemonzter" />
<meta property="og:title" content="About · Our History" />
<meta property="og:description" content="The operator-plus-agents story, told month by month as interactive graphs. How the system evolved from an ephemeral chat into... whatever this is. See another depiction of this at body and watch it evolve." />
<meta property="og:url" content="https://jeremymontz.github.io/Meta1/about/history.html" />
<meta property="og:image" content="https://jeremymontz.github.io/Meta1/design-system/assets/og-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Operation: Claudemonzter — a multi-agent AI lab depicted as a creature on an operating table." />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/svg+xml" href="/Meta1/design-system/assets/favicon.svg" />
<meta name="description" content="The operator-plus-agents story, told month by month as interactive graphs." />

<link rel="stylesheet" href="../design-system/colors_and_type.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
  html, body { background: var(--bg); color: var(--fg); margin: 0; min-height: 100vh; }
  body { font-family: var(--font-sans); }
  a { color: inherit; text-decoration: none; }
  .home-page { width: 100%; max-width: 1280px; margin: 0 auto; }

  .about-subnav {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 40px;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .about-subnav-label { color: var(--fg-faint); }
  .about-subnav-sep   { color: var(--line-loud); }
  .about-subnav a {
    color: var(--fg-muted); text-decoration: none;
    padding-bottom: 2px; border-bottom: 1px solid transparent;
    transition: color 160ms, border-color 160ms;
  }
  .about-subnav a:hover { color: var(--accent); }
  .about-subnav a.active { color: var(--accent); border-bottom-color: var(--accent); }
</style>
</head>
<body>
<div hidden data-seo-summary>
<h1>About · Our History</h1>
<p>The operator-plus-agents story, told month by month as interactive graphs. How the system evolved from an ephemeral chat into... whatever this is. See another depiction of this at body and watch it evolve.</p>
</div>


<div id="root"></div>

<script src="../data.js"></script>
<script type="text/babel" src="../components/Wordmark.jsx"></script>
<script type="text/babel" src="../components/Primitives.jsx"></script>
<script type="text/babel" src="../components/HomeShell.jsx"></script>
<script type="text/babel" src="../components/AboutSubnav.jsx"></script>

<script type="text/babel">
// Resolve site base the same way the shared components do, so root-relative
// HISTORY hrefs work from inside the about/ subfolder.
const _H_SITE_BASE = (() => {
  const tag = document.querySelector('script[src*="data.js"]');
  if (tag) return tag.getAttribute('src').replace(/data\.js.*$/, '');
  return '';
})();

const HISTORY = window.HISTORY || [];

const HistoryIndex = () => (
  <div className="home-page">
    <TopNav active="ABOUT" />
    <AboutSubnav active="HISTORY" />

    {/* Hero */}
    <div style={{ padding: '56px 40px 28px' }}>
         <h1 style={{
        marginTop: 14, fontFamily: 'var(--font-display)', fontWeight: 700,
        fontSize: 72, lineHeight: 0.98, letterSpacing: '-0.025em',
        fontVariationSettings: '"opsz" 144', maxWidth: 880,
      }}>
        The story as <span style={{ fontStyle: 'italic', color: 'var(--accent)' }}>IT happened</span>.
      </h1>
      <p style={{ marginTop: 18, maxWidth: 640, fontSize: 17, lineHeight: 1.5 }}>
        The Claudemonzter experiment told as interactive graphs — one per month or major development.
      </p>
    </div>

    {/* List */}
    <div style={{ padding: '20px 40px 64px' }}>
      <div style={{ borderTop: '1px solid var(--line)' }}>
        {HISTORY.map((h) => {
          const isReal = h.href && h.href !== '#';
          return (
            <a key={h.id} href={isReal ? _H_SITE_BASE + h.href : '#'} style={{
              display: 'grid', gridTemplateColumns: '110px 1fr 220px 70px 24px',
              gap: 24, padding: '28px 0', alignItems: 'baseline',
              borderBottom: '1px solid var(--line)',
              opacity: isReal ? 1 : 0.6,
              transition: 'background 200ms var(--ease-out)',
            }}
            onMouseEnter={e => { if (isReal) e.currentTarget.style.background = 'color-mix(in oklch, var(--accent) 4%, transparent)'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--accent)', letterSpacing: '0.16em' }}>{h.month}</span>
              <div>
                <div style={{
                  fontFamily: 'var(--font-display)', fontSize: 28, fontWeight: 500,
                  letterSpacing: '-0.015em', lineHeight: 1.15, fontVariationSettings: '"opsz" 48',
                }}>{h.title}</div>
                {!isReal && (
                  <div style={{
                    marginTop: 6, fontFamily: 'var(--font-mono)', fontSize: 10,
                    letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--fg-faint)',
                  }}>PLACEHOLDER — NOT YET BUILT</div>
                )}
              </div>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--fg-subtle)', letterSpacing: '0.12em', textTransform: 'uppercase' }}>{h.sub}</span>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--fg-subtle)', textAlign: 'right' }}>{h.read}</span>
              <span style={{ color: isReal ? 'var(--accent)' : 'var(--fg-faint)' }}>↗</span>
            </a>
          );
        })}
      </div>
    </div>

    <Footer />
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<HistoryIndex />);
</script>

</body>
</html>
