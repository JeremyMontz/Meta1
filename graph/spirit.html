<!doctype html>
<html lang="en" data-theme="cabinet">
<head>
<meta charset="utf-8"/>
<title>Spirit · Wisdom of the Day · Claudemonzter</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="Spirit — Phil's daily reading from A Treasury of Traditional Wisdom, and his response through the Map." />

<link rel="stylesheet" href="../design-system/colors_and_type.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    font-family: var(--font-sans);
  }
  a { color: inherit; text-decoration: none; }

  /* Graph sub-nav — matches dashboard.html / heart.html pattern (option A) */
  .graph-subnav {
    display: flex; align-items: center; gap: 24px;
    padding: 12px 40px;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 3;
    background: var(--bg);
  }
  .graph-subnav-label { color: var(--fg-faint); }
  .graph-subnav a {
    color: var(--fg-muted); text-decoration: none;
    padding-bottom: 2px; border-bottom: 1px solid transparent;
    transition: color 160ms, border-color 160ms;
  }
  .graph-subnav a:hover { color: var(--accent); }
  .graph-subnav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Page-turn animation — rotates the leaf about its vertical spine.
     No opacity is animated; the page goes edge-on at ±88°, naturally
     invisible. Two phases: out → swap entry → in. */
  @keyframes spirit-out-next {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(88deg); }
  }
  @keyframes spirit-in-next {
    from { transform: rotateY(-88deg); }
    to   { transform: rotateY(0deg); }
  }
  @keyframes spirit-out-prev {
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(-88deg); }
  }
  @keyframes spirit-in-prev {
    from { transform: rotateY(88deg); }
    to   { transform: rotateY(0deg); }
  }
  .spirit-leaf.turning .spirit-leaf-bleed {
    backface-visibility: hidden;
  }
  .spirit-leaf.out-next .spirit-leaf-bleed {
    animation: spirit-out-next 250ms cubic-bezier(0.55,0,1,0.45) forwards;
  }
  .spirit-leaf.in-next .spirit-leaf-bleed {
    animation: spirit-in-next 340ms cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .spirit-leaf.out-prev .spirit-leaf-bleed {
    animation: spirit-out-prev 250ms cubic-bezier(0.55,0,1,0.45) forwards;
  }
  .spirit-leaf.in-prev .spirit-leaf-bleed {
    animation: spirit-in-prev 340ms cubic-bezier(0.22,1,0.36,1) forwards;
  }

  /* Candle flicker — subtle breathing on the candlelight wash */
  @keyframes candle-breathe {
    0%, 100% { opacity: 1; }
    37%      { opacity: 0.62; }
    55%      { opacity: 0.84; }
    72%      { opacity: 0.55; }
  }
  .room-candle { animation: candle-breathe 5.6s ease-in-out infinite; }
  .candle-dot  { animation: candle-breathe 3.4s ease-in-out infinite; }

  /* Reduced motion: no animations */
  @media (prefers-reduced-motion: reduce) {
    .spirit-leaf .spirit-leaf-bleed,
    .room-candle, .candle-dot { animation: none !important; }
  }

  /* Selection */
  ::selection { background: var(--candle); color: var(--bg); }

  /* Page chrome wrapper */
  .page { width: 100%; max-width: 1280px; margin: 0 auto; }
</style>
</head>

<body>

<div class="page">

  <!-- ─── SITE TOPNAV ─────────────────────────────────────────── -->
  <div id="topnav-mount"></div>

  <!-- ─── GRAPH SUBNAV — option A (Spirit appended) ──────────── -->
  <div id="graph-subnav-mount"></div>

  <!-- ─── PAGE CONTENT (React app) ──────────────────────────── -->
  <div id="root"></div>

  <!-- ─── SITE FOOTER ─────────────────────────────────────────── -->
  <div id="footer-mount"></div>

</div>

<!-- Shared site chrome -->
<script src="../data.js"></script>
<script type="text/babel" src="../components/Wordmark.jsx"></script>
<script type="text/babel" src="../components/Primitives.jsx"></script>
<script type="text/babel" src="../components/HomeShell.jsx"></script>
<script type="text/babel" src="../components/GraphSubnav.jsx"></script>

<!-- Spirit data + components + app -->
<script src="spirit-data.js"></script>
<script type="text/babel" src="spirit-leaf.jsx"></script>
<script type="text/babel" src="spirit-app.jsx"></script>

<!-- Mount site chrome -->
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('topnav-mount')).render(<TopNav active="GRAPH" />);
  ReactDOM.createRoot(document.getElementById('graph-subnav-mount')).render(<GraphSubnav active="SPIRIT" />);
  ReactDOM.createRoot(document.getElementById('footer-mount')).render(<Footer />);
</script>

</body>
</html>
