<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Brain · A vault of info · Claudemonzter</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="Brain — Claudemonzter's knowledge base as a vault graph drawn over a real anatomical brain plate. Five document regions, five memory layers." />

<link rel="stylesheet" href="../design-system/colors_and_type.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { font-family: var(--font-sans); }
  a { color: inherit; text-decoration: none; }

  /* Graph sub-nav — lab register (matches dashboard.html / heart.html pattern) */
  .graph-subnav {
    display: flex; align-items: center; gap: 24px;
    padding: 12px 40px;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 3;
    background: var(--bg);
  }
  .graph-subnav-label { color: var(--fg-faint); }
  .graph-subnav a {
    color: var(--fg-muted); text-decoration: none;
    padding-bottom: 2px; border-bottom: 1px solid transparent;
    transition: color 160ms, border-color 160ms;
  }
  .graph-subnav a:hover { color: var(--accent); }
  .graph-subnav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Node ring-pulse — the only animation on the page.
     Gated behind prefers-reduced-motion so it stays static when asked. */
  @keyframes cm-node-pulse {
    0%   { transform: scale(0.5); opacity: 0.95; }
    65%  { opacity: 0.5; }
    100% { transform: scale(3.4); opacity: 0; }
  }
  .node-pulse {
    transform-box: fill-box; transform-origin: center;
    opacity: 0; /* hidden by default; animation reveals it */
  }
  @media (prefers-reduced-motion: no-preference) {
    .node-pulse { animation: cm-node-pulse 1.35s ease-out infinite; }
  }

  ::selection { background: var(--accent); color: var(--bg); }

  /* Page chrome wrapper */
  .page { width: 100%; max-width: 1280px; margin: 0 auto; }
</style>
</head>

<body>

<div class="page">

  <!-- ─── SITE TOPNAV ─────────────────────────────────────────── -->
  <div id="topnav-mount"></div>

  <!-- ─── GRAPH SUBNAV (Brain active) ─────────────────────────── -->
  <div id="graph-subnav-mount"></div>

  <!-- ─── PAGE CONTENT (React app) ────────────────────────────── -->
  <div id="root"></div>

  <!-- ─── SITE FOOTER ─────────────────────────────────────────── -->
  <div id="footer-mount"></div>

</div>

<!-- Shared site chrome -->
<script src="../data.js"></script>
<script type="text/babel" src="../components/Wordmark.jsx"></script>
<script type="text/babel" src="../components/Primitives.jsx"></script>
<script type="text/babel" src="../components/HomeShell.jsx"></script>
<script type="text/babel" src="../components/GraphSubnav.jsx"></script>

<!-- Brain data + shared atoms + stage + app -->
<script src="brain-data.js"></script>
<script type="text/babel" src="brain-shared.jsx"></script>
<script type="text/babel" src="brain-stage.jsx"></script>
<script type="text/babel" src="brain-app.jsx"></script>

<!-- Mount site chrome -->
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('topnav-mount')).render(<TopNav active="GRAPH" />);
  ReactDOM.createRoot(document.getElementById('graph-subnav-mount')).render(<GraphSubnav active="BRAIN" />);
  ReactDOM.createRoot(document.getElementById('footer-mount')).render(<Footer />);
</script>

</body>
</html>
