<style>
  html, body { background: var(--bg); color: var(--fg); margin: 0; min-height: 100vh; }
  body { padding: 0; margin: 0; overflow-x: hidden; font-family: var(--font-sans); }
  a { color: inherit; text-decoration: none; }

  /* Graph sub-nav — matches dashboard.html */
  .graph-subnav {
    display: flex; align-items: center; gap: 24px;
    padding: 12px 40px;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 1;
  }
  .graph-subnav-label { color: var(--fg-faint); }
  .graph-subnav a { color: var(--fg-muted); text-decoration: none; padding-bottom: 2px; border-bottom: 1px solid transparent; }
  .graph-subnav a:hover { color: var(--accent); }
  .graph-subnav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* fixed background layers — subtle grid + optional scanlines */
  .bg-grid-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: var(--grid-size) var(--grid-size);
    opacity: 0.55;
  }
  .bg-scan-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: repeating-linear-gradient(0deg, transparent 0 2px, var(--scan-color) 2px 3px);
    mix-blend-mode: screen; opacity: 0.35;
  }

  /* matrix interactions */
  .memory-row { transition: filter 200ms var(--ease-out); }
  .memory-row:hover { filter: brightness(1.08); }
  .memory-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* detail fade */
  @keyframes memory-fade-in {
    from { opacity: 0; transform: translateY(-2px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* selection */
  ::selection { background: var(--accent); color: var(--bg); }

  /* ── Mobile (#163): readable header, stacked sections, scrollable matrix ── */
  @media (max-width: 720px) {
    .mem-head-row { flex-wrap: wrap; }
    .mem-head-meta { flex-basis: 100% !important; max-width: none !important; text-align: left !important; margin-top: 8px; }
    .mem-sec-head { grid-template-columns: 1fr !important; gap: 8px !important; }
    .mem-bridges { grid-template-columns: 1fr !important; }
    .mtx-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .mtx-scroll > div { min-width: 700px; }
  }
</style>
</head>
<body>
<div hidden data-seo-summary>
<h1>Memory · Layer Map</h1>
<p>The configuration layers: how context is tiered from user settings, to claude.md and project domains, and managing ephermeral memory as it moves from the inbox to the wiki. How a thought becomes canon.</p>
</div>

  ReactDOM.createRoot(document.getElementById('footer-mount')).render(<Footer />);
</script>
